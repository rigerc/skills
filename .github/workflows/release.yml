# Per-binary / per-skill release streams (architecture.md §1, §8b.1).
# release-please opens/maintains release PRs; merging one cuts a PREFIXED tag
# (oxid-v1.4.0, terraform-plan-review-v1.4.0). For a CLI tag, goreleaser then
# builds that binary's cross-OS/arch assets. Prefixed tags are what let mise
# track each stream via tag_regex — see mise.toml.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # dispatch once after creating-from-template (see README)

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.rp.outputs.releases_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    # Only run for a CLI release tag (the cmd/ streams), e.g. oxid-v*.
    if: needs.release-please.outputs.releases == 'true' && startsWith(needs.release-please.outputs.tag, 'oxid-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
